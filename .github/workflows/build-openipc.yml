name: Build OpenIPC SSC335DE (Wi‑Fi RT8188EU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make wget unzip bison flex libncurses5-dev \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libssl-dev zlib1g-dev

      - name: Run builder for SSC335DE
        run: ./builder.sh -p ssc335de

      - name: Enable RTL8188EU + Wi‑Fi stack + USB
        run: |
          # Включаем драйвер как модуль
          sed -i 's/^CONFIG_RTL8188EU=.*$/CONFIG_RTL8188EU=m/' .config
          # Включаем Wi‑Fi стек
          sed -i 's/^CONFIG_CFG80211=.*$/CONFIG_CFG80211=y/' .config
          sed -i 's/^CONFIG_MAC80211=.*$/CONFIG_MAC80211=y/' .config
          # USB хост (если Wi‑Fi на USB‑донгле)
          sed -i 's/^CONFIG_USB_EHCI_HCD=.*$/CONFIG_USB_EHCI_HCD=y/' .config
          sed -i 's/^CONFIG_USB_OHCI_HCD=.*$/CONFIG_USB_OHCI_HCD=y/' .config
          sed -i 's/^CONFIG_USB_SUPPORT=.*$/CONFIG_USB_SUPPORT=y/' .config

          # Сохраняем конфиг
          make savedefconfig
          mv defconfig .config

      - name: Build firmware
        run: make -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openipc-ssc335de-images
          path: images/*
          retention-days: 7
