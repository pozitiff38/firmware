name: Build OpenIPC SSC335DE (Wi‑Fi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make wget unzip bison flex libncurses5-dev \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libssl-dev zlib1g-dev

      - name: Prepare build
        run: |
          make ssc335de_defconfig
          sed -i 's/^CONFIG_RTL8188EU=.*\$/CONFIG_RTL8188EU=m/' .config
          sed -i 's/^CONFIG_CFG80211=.*\$/CONFIG_CFG80211=y/' .config
          sed -i 's/^CONFIG_MAC80211=.*\$/CONFIG_MAC80211=y/' .config
          make savedefconfig
          mv defconfig .config

      - name: Build
        run: make -j\$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openipc-ssc335de-images
          path: images/*
